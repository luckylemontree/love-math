<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--css likn-->
    <link rel="stylesheet" href="assets/css/style.css">

    <!--FontAwesome link-->

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
        integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <!--Google Fonts link-->

    <link href="https://fonts.googleapis.com/css?family=Raleway%7CRighteous" rel="stylesheet">

    <title>love math</title>
</head>

<!--========  body =====================-->

<body>


    <!--========  header ==========-->

    <h1 class="heading">
        <img class="logo" src="assets/img/logo.png" alt="love maths logo">Love maths
    </h1>




    <!--========  games area ==========-->
    <div class="game-area">
        <!--control area-->
        <div class="controls-area">
            <button data-type="ADDITION" class="btn btn--big btn--green">
                <i class="fas fa-plus"></i>
            </button>
            <button data-type="SUBTRACT" class="btn btn--big btn--blue">
                <i class="fas fa-minus"></i>
            </button>
            <button data-type="MULTIPLY"  class="btn btn--big btn--orange">
                <i class="fas fa-times"></i>
            </button>
            <button data-type="DIVISION"  class="btn btn--big btn--red">
                <i class="fas fa-divide"></i>
            </button>
        </div>
        <!--question area-->
        <div class="question-area">
            <span class="operand1">0</span>
            <span class="operator">x</span>
            <span class="operand2">0</span>
            <span> = </span>
            <p class="answer-message">Enter Answer</p>
            <input id="answer-box" type="number" name="answer">
        </div>
        <button data-type="submit" class="btn btn--gray" type="submit">Submit Answer</buttom>

    </div>



    <!--========  score area ==========-->
    <div class="score-area">
        <p class="scores">Correct Answer <span id="score">0</span></p>
        <p class="scores">incorrect Answer <span id="incorrect">0</span></p>
    </div>





    <!--Javascript link-->
    <script src="assets/js/script.js"></script>

   
</body>

</html>
